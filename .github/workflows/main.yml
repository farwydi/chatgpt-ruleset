name: build-ruleset

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install sing-box
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -oP '"tag_name":\s*"\Kv[^"]+' | head -n1)"
          ver="${version#v}"
          tarball="sing-box-${ver}-linux-amd64.tar.gz"
          curl -fsSL -o sing-box.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/${version}/${tarball}"
          tar -xzf sing-box.tgz
          sudo install -m 0755 "sing-box-${ver}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Build rule-sets
        run: python3 scripts/build_ruleset.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: singbox-ruleset
          path: dist/
          if-no-files-found: error

      - name: Publish rolling `latest` release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest rule-sets
          body: |
            Automatically rebuilt sing-box rule-sets.

            Stable download URLs (always point to the most recent build):

            - https://github.com/${{ github.repository }}/releases/latest/download/chatgpt.srs
            - https://github.com/${{ github.repository }}/releases/latest/download/chatgpt-domains.srs
            - https://github.com/${{ github.repository }}/releases/latest/download/chatgpt-ips.srs
            - https://github.com/${{ github.repository }}/releases/latest/download/chatgpt.json
            - https://github.com/${{ github.repository }}/releases/latest/download/chatgpt-domains.json
            - https://github.com/${{ github.repository }}/releases/latest/download/chatgpt-ips.json

            Built from commit ${{ github.sha }}.
          files: |
            dist/chatgpt.srs
            dist/chatgpt-domains.srs
            dist/chatgpt-ips.srs
            dist/chatgpt.json
            dist/chatgpt-domains.json
            dist/chatgpt-ips.json
          make_latest: "true"
